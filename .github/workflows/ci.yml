name: SENTINEL AI CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install System Dependencies (OpenCV & OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff Code Formatter & Linter Check
        run: |
          ruff check .

      - name: Generate Synthetic Video Fixture
        run: |
          python scripts/create_synthetic_fixtures.py

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest -v --cov=sentinel --cov-report=term-missing

      - name: Run Multi-Agent Deterministic Evaluation Benchmark
        run: |
          python scripts/evaluate_agents.py --output data/evaluation/agent_ci_benchmark.json

  frontend-quality-and-build:
    name: Frontend TypeScript Verification & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation & Build Production Bundle
        run: npm run build

  docker-syntax-and-compose-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
