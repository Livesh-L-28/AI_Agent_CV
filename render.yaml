# ==============================================================================
# SENTINEL AI — Render Blueprint (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: sentinel-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_CAMERA_AUTOSTART
        value: "false"
      - key: SERVE_FRONTEND
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: YOLO_DEVICE
        value: cpu
      - key: LLM_PROVIDER
        value: mock
      - key: ENABLE_MOCK_LLM
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/sentinel.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SENTINEL_JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
